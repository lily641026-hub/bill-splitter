<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>聚餐分帳器</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #19312c; background: #f5f7f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px 16px; display: grid; place-items: center; }
    main { width: min(100%, 480px); }
    .eyebrow { margin: 0 0 10px; color: #497b65; font-size: 13px; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 0; color: #2563eb; font-size: clamp(30px, 8vw, 40px); letter-spacing: -.04em; }
    .intro { margin: 10px 0 24px; color: #5c6e67; line-height: 1.6; }
    .card { padding: 25px; background: #fff; border: 1px solid #e5ebe3; border-radius: 24px; box-shadow: 0 14px 38px #1b3b2910; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 9px; font-weight: 750; }
    .input-wrap { position: relative; }
    input[type="number"] { width: 100%; min-height: 54px; padding: 0 52px 0 15px; border: 1.5px solid #d3dfd7; border-radius: 12px; background: #fff; color: #19312c; font: inherit; font-size: 20px; font-weight: 650; appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { appearance: none; }
    input:focus-visible { outline: 3px solid #a9ddbc; outline-offset: 2px; }
    .unit { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #6d8074; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 0 2px; border-top: 1px solid #e9eee9; }
    .switch-row label { margin: 0; }
    .switch-row small { display: block; margin-top: 4px; color: #718278; font-size: 13px; font-weight: 400; }
    .switch-row input { width: 22px; height: 22px; margin: 0; accent-color: #237a55; cursor: pointer; }
    .error { min-height: 24px; margin: 13px 0 0; color: #af3434; font-size: 14px; }
    .result { margin-top: 18px; padding: 24px; border-radius: 24px; background: #e7f3e8; }
    .result h2 { margin: 0 0 18px; font-size: 17px; }
    .share { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 8px; margin: 15px 0; }
    .share strong { font-size: clamp(26px, 7vw, 34px); letter-spacing: -.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .share .name { font-weight: 700; }
    .note { margin: 4px 0 0; color: #32674c; font-size: 14px; line-height: 1.5; }
    .divider { height: 1px; margin: 21px 0 16px; background: #cfe3d2; }
    .detail { display: flex; justify-content: space-between; gap: 14px; margin: 9px 0; color: #526b5a; font-size: 14px; }
    .detail.total { margin-top: 14px; padding-top: 14px; border-top: 1px solid #cfe3d2; color: #19312c; font-weight: 800; }
    .footnote { margin: 17px 3px 0; color: #718278; font-size: 13px; line-height: 1.5; }
    @media (max-width: 360px) { .card, .result { padding: 19px; } .share strong { font-size: 24px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">一起吃飯，輕鬆分帳</p>
    <h1>聚餐分帳器</h1>
    <p class="intro">輸入帳單金額和人數，馬上算出每個人該付多少。</p>

    <section class="card" aria-label="分帳設定">
      <div class="field">
        <label for="amount">帳單金額</label>
        <div class="input-wrap"><input id="amount" type="number" inputmode="numeric" min="0" max="1000000000000" step="1" value="1000" aria-describedby="error"><span class="unit">元</span></div>
      </div>
      <div class="field">
        <label for="people">用餐人數（包含付錢的人）</label>
        <div class="input-wrap"><input id="people" type="number" inputmode="numeric" min="1" max="1000000" step="1" value="3" aria-describedby="error"><span class="unit">人</span></div>
      </div>
      <div class="switch-row">
        <label for="service">加 10% 服務費<small>以整元四捨五入</small></label>
        <input id="service" type="checkbox">
      </div>
      <p id="error" class="error" role="alert"></p>
    </section>

    <section id="result" class="result" aria-live="polite" aria-label="分帳結果">
      <h2>分帳結果</h2>
      <div class="share"><span class="name">付錢的人</span><strong id="payer">334 元</strong></div>
      <div id="othersRow" class="share"><span id="othersName" class="name">其他 2 人，各付</span><strong id="others">333 元</strong></div>
      <p id="remainderNote" class="note">多出的 1 元零頭由付錢的人負擔。</p>
      <div class="divider"></div>
      <div class="detail"><span>帳單金額</span><span id="bill">1,000 元</span></div>
      <div class="detail"><span>服務費</span><span id="fee">0 元</span></div>
      <div class="detail total"><span>應付總額</span><span id="total">1,000 元</span></div>
    </section>
    <p class="footnote">所有計算都在這個網頁內完成；不需網路、登入或儲存資料。</p>
  </main>
  <script>
    const amountInput = document.getElementById('amount');
    const peopleInput = document.getElementById('people');
    const serviceInput = document.getElementById('service');
    const result = document.getElementById('result');
    const error = document.getElementById('error');
    const fmt = number => new Intl.NumberFormat('zh-TW').format(number) + ' 元';

    function update() {
      const amount = Number(amountInput.value);
      const people = Number(peopleInput.value);
      let message = '';
      if (amountInput.value === '' || !Number.isSafeInteger(amount) || amount < 0 || amount > 1000000000000) {
        message = '請輸入 0 到 1 兆之間的整數金額。';
      } else if (peopleInput.value === '' || !Number.isSafeInteger(people) || people < 1 || people > 1000000) {
        message = '請輸入 1 到 100 萬之間的整數人數。';
      }
      error.textContent = message;
      result.hidden = Boolean(message);
      if (message) return;

      // Integer arithmetic keeps the displayed shares and displayed total consistent.
      const fee = serviceInput.checked ? Math.floor((amount + 5) / 10) : 0;
      const total = amount + fee;
      const each = Math.floor(total / people);
      const remainder = total % people;
      const payer = each + remainder;

      document.getElementById('payer').textContent = fmt(payer);
      document.getElementById('others').textContent = fmt(each);
      document.getElementById('othersName').textContent = `其他 ${fmtCount(people - 1)} 人，各付`;
      document.getElementById('othersRow').hidden = people === 1;
      document.getElementById('remainderNote').textContent = remainder
        ? `多出的 ${fmt(remainder)}零頭由付錢的人負擔。`
        : '金額剛好平分，沒有零頭。';
      document.getElementById('bill').textContent = fmt(amount);
      document.getElementById('fee').textContent = fmt(fee);
      document.getElementById('total').textContent = fmt(total);
    }
    const fmtCount = number => new Intl.NumberFormat('zh-TW').format(number);
    [amountInput, peopleInput, serviceInput].forEach(input => input.addEventListener('input', update));
    update();
  </script>
</body>
</html>
