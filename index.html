<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>聚餐分帳器</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #392b2b; background: #fff7eb; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; padding: clamp(24px, 5vw, 64px) 20px; background: radial-gradient(circle at 90% 5%, #ffe0a8 0, transparent 27%), radial-gradient(circle at 5% 90%, #ffe4d8 0, transparent 28%); }
    main { width: min(100%, 980px); margin: 0 auto; }
    header { margin-bottom: 34px; }
    .eyebrow { display: inline-block; margin: 0 0 16px; padding: 7px 12px; border-radius: 999px; background: #ffe0ad; color: #8a491f; font-size: 12px; font-weight: 800; letter-spacing: .1em; }
    h1 { margin: 0; font-size: clamp(36px, 6vw, 56px); line-height: 1.15; letter-spacing: -.055em; }
    .intro { margin: 13px 0 0; color: #776767; line-height: 1.7; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; gap: 20px; }
    .card, .result { padding: clamp(24px, 3vw, 34px); border-radius: 28px; }
    .card { background: #fff; border: 1px solid #f2dfd1; box-shadow: 0 16px 45px #81482912; }
    .card h2, .result h2 { margin: 0 0 25px; font-size: 18px; letter-spacing: -.02em; }
    .field { margin-bottom: 23px; }
    label { display: block; margin-bottom: 10px; font-weight: 750; }
    .input-wrap { position: relative; }
    input[type="number"] { width: 100%; min-height: 58px; padding: 0 52px 0 17px; border: 1.5px solid #ead9ca; border-radius: 14px; background: #fffaf5; color: #392b2b; font: inherit; font-size: 21px; font-weight: 700; appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { appearance: none; }
    input:focus-visible { outline: 3px solid #ffbc86; outline-offset: 2px; }
    .unit { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #6d8074; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 21px 0 2px; border-top: 1px solid #e9eee9; }
    .switch-row label { margin: 0; }
    .switch-row small { display: block; margin-top: 4px; color: #718278; font-size: 13px; font-weight: 400; }
    .switch-row input { width: 22px; height: 22px; margin: 0; accent-color: #e36c3b; cursor: pointer; }
    .error { min-height: 24px; margin: 13px 0 0; color: #af3434; font-size: 14px; }
    .result { background: #ffe7c5; border: 1px solid #f7cea2; }
    .result h2 { color: #8a491f; }
    .share { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 8px; margin: 17px 0; }
    .share strong { font-size: clamp(25px, 3.4vw, 34px); letter-spacing: -.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .share:first-of-type { display: block; padding: 22px; margin: 0 0 23px; border-radius: 20px; background: #fff; }
    .share:first-of-type .name { display: block; margin-bottom: 7px; color: #806156; font-size: 14px; }
    .share:first-of-type strong { display: block; color: #b94e2b; font-size: clamp(34px, 4vw, 44px); }
    .share .name { font-weight: 700; }
    .note { margin: 4px 0 0; color: #8a491f; font-size: 14px; line-height: 1.5; }
    .divider { height: 1px; margin: 24px 0 17px; background: #e9bb8c; }
    .detail { display: flex; justify-content: space-between; gap: 14px; margin: 9px 0; color: #735b4a; font-size: 14px; }
    .detail.total { margin-top: 14px; padding-top: 14px; border-top: 1px solid #e9bb8c; color: #392b2b; font-weight: 800; }
    .copy-button { width: 100%; min-height: 48px; margin-top: 22px; border: 0; border-radius: 14px; background: #b94e2b; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    .copy-button:hover { background: #9d3e22; }
    .copy-button:focus-visible { outline: 3px solid #b94e2b; outline-offset: 3px; }
    .copy-status { min-height: 21px; margin: 8px 0 0; color: #8a491f; font-size: 13px; text-align: center; }
    .footnote { margin: 22px 3px 0; color: #718278; font-size: 13px; line-height: 1.5; text-align: center; }
    @media (max-width: 720px) { .workspace { grid-template-columns: 1fr; } header { margin-bottom: 25px; } }
    @media (max-width: 360px) { .card, .result { padding: 20px; } .share strong { font-size: 24px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">🍽️ 一起吃飯，輕鬆分帳</p>
      <h1>聚餐分帳器</h1>
      <p class="intro">吃飯盡興，分帳也要輕鬆。輸入金額和人數，馬上算出每個人該付多少。</p>
    </header>

    <div class="workspace">
      <section class="card" aria-label="分帳設定">
      <h2>🧾 這餐怎麼分？</h2>
      <div class="field">
        <label for="amount">帳單金額</label>
        <div class="input-wrap"><input id="amount" type="number" inputmode="numeric" min="0" max="1000000000000" step="1" value="1000" aria-describedby="error"><span class="unit">元</span></div>
      </div>
      <div class="field">
        <label for="people">用餐人數（包含付錢的人）</label>
        <div class="input-wrap"><input id="people" type="number" inputmode="numeric" min="1" max="1000000" step="1" value="3" aria-describedby="error"><span class="unit">人</span></div>
      </div>
      <div class="switch-row">
        <label for="service">加 10% 服務費<small>以整元四捨五入</small></label>
        <input id="service" type="checkbox">
      </div>
      <p id="error" class="error" role="alert"></p>
      </section>

      <section id="result" class="result" aria-live="polite" aria-label="分帳結果">
      <h2>✨ 分帳結果</h2>
      <div class="share"><span class="name">付錢的人</span><strong id="payer">334 元</strong></div>
      <div id="othersRow" class="share"><span id="othersName" class="name">其他 2 人，各付</span><strong id="others">333 元</strong></div>
      <p id="remainderNote" class="note">多出的 1 元零頭由付錢的人負擔。</p>
      <div class="divider"></div>
      <div class="detail"><span>帳單金額</span><span id="bill">1,000 元</span></div>
      <div class="detail"><span>服務費</span><span id="fee">0 元</span></div>
      <div class="detail total"><span>應付總額</span><span id="total">1,000 元</span></div>
      <button id="copyButton" class="copy-button" type="button">複製分帳明細</button>
      <p id="copyStatus" class="copy-status" role="status" aria-live="polite"></p>
      </section>
    </div>
    <p class="footnote">所有計算都在這個網頁內完成；不需網路、登入或儲存資料。</p>
  </main>
  <script>
    const amountInput = document.getElementById('amount');
    const peopleInput = document.getElementById('people');
    const serviceInput = document.getElementById('service');
    const result = document.getElementById('result');
    const error = document.getElementById('error');
    const copyButton = document.getElementById('copyButton');
    const copyStatus = document.getElementById('copyStatus');
    const fmt = number => new Intl.NumberFormat('zh-TW').format(number) + ' 元';

    function update() {
      copyStatus.textContent = '';
      const amount = Number(amountInput.value);
      const people = Number(peopleInput.value);
      let message = '';
      if (amountInput.value === '' || !Number.isSafeInteger(amount) || amount < 0 || amount > 1000000000000) {
        message = '請輸入 0 到 1 兆之間的整數金額。';
      } else if (peopleInput.value === '' || !Number.isSafeInteger(people) || people < 1 || people > 1000000) {
        message = '請輸入 1 到 100 萬之間的整數人數。';
      }
      error.textContent = message;
      result.hidden = Boolean(message);
      if (message) return;

      // Integer arithmetic keeps the displayed shares and displayed total consistent.
      const fee = serviceInput.checked ? Math.floor((amount + 5) / 10) : 0;
      const total = amount + fee;
      const each = Math.floor(total / people);
      const remainder = total % people;
      const payer = each + remainder;

      document.getElementById('payer').textContent = fmt(payer);
      document.getElementById('others').textContent = fmt(each);
      document.getElementById('othersName').textContent = `其他 ${fmtCount(people - 1)} 人，各付`;
      document.getElementById('othersRow').hidden = people === 1;
      document.getElementById('remainderNote').textContent = remainder
        ? `多出的 ${fmt(remainder)}零頭由付錢的人負擔。`
        : '金額剛好平分，沒有零頭。';
      document.getElementById('bill').textContent = fmt(amount);
      document.getElementById('fee').textContent = fmt(fee);
      document.getElementById('total').textContent = fmt(total);
    }
    const fmtCount = number => new Intl.NumberFormat('zh-TW').format(number);
    [amountInput, peopleInput, serviceInput].forEach(input => input.addEventListener('input', update));
    copyButton.addEventListener('click', async () => {
      const lines = [
        '聚餐分帳明細',
        `帳單金額：${document.getElementById('bill').textContent}`,
        `服務費：${document.getElementById('fee').textContent}`,
        `應付總額：${document.getElementById('total').textContent}`,
        `付錢的人：${document.getElementById('payer').textContent}`
      ];
      if (!document.getElementById('othersRow').hidden) {
        lines.push(`${document.getElementById('othersName').textContent}：${document.getElementById('others').textContent}`);
      }
      lines.push(document.getElementById('remainderNote').textContent);
      const summary = lines.join('\n');
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(summary);
        } else {
          const temporary = document.createElement('textarea');
          temporary.value = summary;
          temporary.style.position = 'fixed';
          temporary.style.opacity = '0';
          document.body.appendChild(temporary);
          let copied;
          try {
            temporary.select();
            copied = document.execCommand('copy');
          } finally {
            temporary.remove();
          }
          if (!copied) throw new Error('Copy command failed');
        }
        copyStatus.textContent = '已複製，可以貼到群組了！';
      } catch {
        copyStatus.textContent = '複製失敗，請手動選取分帳結果。';
      }
    });
    update();
  </script>
</body>
</html>
